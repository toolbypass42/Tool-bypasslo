<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Bypass Link - Gtraffic</title>
    <style>
        /* ===== RESET & BIẾN MÀU ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        :root {
            --bg-dark: #0a0e17;
            --bg-card: #111827;
            --blue-main: #00b4d8;
            --blue-glow: #48cae4;
            --pink-main: #ff2e63;
            --pink-glow: #ff6b9d;
            --text-main: #e0e0e0;
            --text-dim: #8892a0;
            --error-red: #ff2e63;
            --success-green: #00e676;
            --border-glow: rgba(0, 180, 216, 0.3);
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 180, 216, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 46, 99, 0.08) 0%, transparent 50%);
        }

        /* ===== KHUNG CHÍNH ===== */
        .container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px 24px;
            border: 1px solid rgba(0, 180, 216, 0.25);
            box-shadow: 
                0 0 30px rgba(0, 180, 216, 0.15),
                0 0 60px rgba(255, 46, 99, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Đường viền phát sáng chạy quanh */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--blue-main), var(--pink-main), var(--blue-main));
            border-radius: 22px;
            z-index: -1;
            animation: borderRotate 4s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== TIÊU ĐỀ ===== */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--blue-glow), var(--pink-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .header .sub {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ===== DANH SÁCH LINK ===== */
        .link-section {
            margin-bottom: 20px;
        }

        .link-section .label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: block;
        }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .link-btn {
            background: rgba(0, 180, 216, 0.08);
            border: 1px solid rgba(0, 180, 216, 0.2);
            color: var(--text-main);
            padding: 10px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            border-color: var(--blue-main);
            background: rgba(0, 180, 216, 0.15);
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.2);
            transform: translateY(-1px);
        }

        .link-btn.selected {
            border-color: var(--pink-main);
            background: rgba(255, 46, 99, 0.12);
            box-shadow: 0 0 15px rgba(255, 46, 99, 0.2);
            color: var(--pink-glow);
        }

        .link-btn .check {
            display: none;
            position: absolute;
            top: 3px;
            right: 6px;
            font-size: 10px;
            color: var(--pink-glow);
        }

        .link-btn.selected .check {
            display: block;
        }

        /* ===== Ô NHẬP URL ===== */
        .input-section {
            margin-bottom: 20px;
        }

        .input-section .label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: block;
        }

        .url-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 180, 216, 0.25);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input::placeholder {
            color: var(--text-dim);
            font-size: 12px;
        }

        .url-input:focus {
            border-color: var(--blue-main);
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.15);
        }

        /* ===== NÚT VƯỢT LINK ===== */
        .btn-bypass {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--blue-main), var(--pink-main));
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(0, 180, 216, 0.35);
        }

        .btn-bypass:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(0, 180, 216, 0.5);
            filter: brightness(1.1);
        }

        .btn-bypass:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .btn-bypass .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        .btn-bypass.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== BẢNG TRẠNG THÁI ===== */
        .status-panel {
            margin-top: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 180, 216, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
            display: none;
        }

        .status-panel.active {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-row .key {
            color: var(--text-dim);
            font-weight: 500;
        }

        .status-row .val {
            color: var(--text-main);
            font-weight: 600;
            font-family: 'Consolas', monospace;
            font-size: 11px;
        }

        .status-row .val.ready { color: var(--success-green); }
        .status-row .val.checking { color: #ffc107; }
        .status-row .val.success { color: var(--success-green); }
        .status-row .val.error { color: var(--error-red); }
        .status-row .val.loading { color: var(--blue-glow); }

        /* Thanh tiến trình */
        .progress-bar {
            margin-top: 12px;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--blue-main), var(--pink-main));
            border-radius: 3px;
            transition: width 1s linear;
        }

        /* ===== THÔNG BÁO LỖI ===== */
        .error-box {
            margin-top: 14px;
            padding: 12px 16px;
            background: rgba(255, 46, 99, 0.1);
            border: 1px solid rgba(255, 46, 99, 0.35);
            border-radius: 10px;
            color: var(--error-red);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: none;
            text-align: center;
            line-height: 1.5;
            animation: shake 0.4s ease;
        }

        .error-box.active {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* ===== KẾT QUẢ ===== */
        .result-box {
            margin-top: 14px;
            padding: 14px 16px;
            background: rgba(0, 230, 118, 0.06);
            border: 1px solid rgba(0, 230, 118, 0.3);
            border-radius: 10px;
            display: none;
            animation: fadeSlide 0.4s ease;
        }

        .result-box.active {
            display: block;
        }

        .result-box .title {
            font-size: 11px;
            color: var(--success-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .result-box .link-out {
            font-size: 12px;
            color: var(--blue-glow);
            word-break: break-all;
            text-decoration: none;
            font-weight: 600;
            line-height: 1.5;
            display: block;
        }

        .result-box .link-out:hover {
            text-decoration: underline;
        }

        /* ===== THÔNG TIN THIẾT BỊ ===== */
        .device-info {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .device-info span {
            font-family: 'Consolas', monospace;
        }

        /* ===== THÔNG BÁO PHỤ ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card);
            border: 1px solid var(--blue-main);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.35s ease;
            z-index: 999;
            box-shadow: 0 0 25px rgba(0, 180, 216, 0.3);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.pink {
            border-color: var(--pink-main);
            box-shadow: 0 0 25px rgba(255, 46, 99, 0.3);
        }

        /* Responsive */
        @media (max-width: 420px) {
            .container { padding: 20px 16px; }
            .link-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- TIÊU ĐỀ -->
    <div class="header">
        <h1>⚡ Bypass Tool ⚡</h1>
        <div class="sub">Gtraffic System v2.0</div>
    </div>

    <!-- DANH SÁCH LINK XÁC NHẬN -->
    <div class="link-section">
        <span class="label">▸ Chọn link xác nhận</span>
        <div class="link-grid" id="linkGrid">
            <button class="link-btn" data-link="gtraffic">Gtraffic.io<span class="check">✓</span></button>
            <button class="link-btn" data-link="link4m">Link4m<span class="check">✓</span></button>
            <button class="link-btn" data-link="layma">Layma.net<span class="check">✓</span></button>
            <button class="link-btn" data-link="traffic4k">Traffic4k.com<span class="check">✓</span></button>
            <button class="link-btn" data-link="site2s">Site2s.com<span class="check">✓</span></button>
            <button class="link-btn" data-link="bbmkt">Bbmkt.com<span class="check">✓</span></button>

    <!-- Ô NHẬP URL -->

        <span class="label">▸ Dán URL cần vượt link</span>

    </div>

    <!-- NÚT VƯỢT LINK -->
    <button class="btn-bypass" id="btnBypass">
        <span class="spinner"></span>
        <span class="btn-text">🚀 VƯỢT LINK</span>
    </button>

    <!-- THÔNG BÁO LỖI -->
    <div class="error-box" id="errorBox"></div>

    <!-- BẢNG TRẠNG THÁI -->
    <div class="status-panel" id="statusPanel">
        <div class="status-row">
            <span class="key">Trạng thái</span>
            <span class="val ready" id="stStatus">Sẵn sàng</span>
        </div>
        <div class="status-row">
            <span class="key">IP thiết bị</span>
            <span class="val" id="stIP">--</span>

        <div class="status-row">
            <span class="key">Thời gian</span>
            <span class="val" id="stTime">--</span>
        </div>
        <div class="status-row">
            <span class="key">Tiến trình</span>
            <span class="val loading" id="stStep">Đang khởi tạo...</span>
        </div>
        <div class="progress-bar active" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>

    <!-- KẾT QUẢ -->
    <div class="result-box" id="resultBox">
        <div class="title">✅ Bypass thành công!</div>
        <a href="#" class="link-out" id="resultLink" target="_blank" rel="noopener">--</a>
    </div>

    <!-- THÔNG TIN THIẾT BỊ ẨN -->
    <div class="device-info">
        <span id="deviceIP">IP: --</span>
        <span id="deviceTime">--</span>
    </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   TOOL BYPASS LINK - GTRaffIC SYSTEM
   Logic:
   - Chọn link xác nhận (ít nhất 1)
   - Nhập URL dạng https://
   - Ấn VƯỢT LINK -> chờ 15s -> hiển thị trạng thái
   - Tỷ lệ lỗi: 85% lỗi kết nối, 15% lỗi 404
   - Map URL -> link kết quả
   ============================================================ */

(function() {
    'use strict';

    // ===== DOM ELEMENTS =====
    const linkGrid    = document.getElementById('linkGrid');
    const urlInput    = document.getElementById('urlInput');
    const btnBypass   = document.getElementById('btnBypass');
    const btnText     = btnBypass.querySelector('.btn-text');
    const errorBox    = document.getElementById('errorBox');
    const statusPanel = document.getElementById('statusPanel');
    const resultBox   = document.getElementById('resultBox');
    const resultLink  = document.getElementById('resultLink');
    const stStatus    = document.getElementById('stStatus');
    const stIP        = document.getElementById('stIP');
    const stTime      = document.getElementById('stTime');
    const stStep      = document.getElementById('stStep');
    const progressFill= document.getElementById('progressFill');
    const deviceIP    = document.getElementById('deviceIP');
    const deviceTime  = document.getElementById('deviceTime');
    const toast       = document.getElementById('toast');

    // ===== TRẠNG THÁI =====
    let selectedLinks = [];
    let isProcessing = false;

    // ===== MAP URL -> KẾT QUẢ =====
    const RESULT_MAP = {
        'https://layma.net/5ABkvpfQu' : 'https://www.mediafire.com/file/msusgfxw3xosdpl/AimLock+Bro.zip/file',
        'https://link4m.net/eYerc'    : 'https://www.mediafire.com/file/yqefvmq4mefu7h5/Minecraft_PE_26.30_BANDISHARE.apk/file',
        'https://bbmkts.com/go/Hfz47hy5': 'https://www.mediafire.com/file/i5eioodkjudzmty/hackff+menuFFM.zip/file',
        'https://gtraffic.io/Yv2QaKD' : 'https://pastefy.app/bbSrxKOk/raw'
    };

    // ===== CÁC BƯỚC TRẠNG THÁI =====
    const STEPS = [
        { text: 'Đang kiểm tra kết nối...',      cls: 'checking' },
        { text: 'Kết nối thành công!',            cls: 'success'  },
        { text: 'Đang tải module...',             cls: 'loading'  },
        { text: 'Tải module hoàn tất!',           cls: 'success'  },
        { text: 'Đang giả lập bypass...',         cls: 'loading'  },
        { text: 'Bỏ qua xác thực...',             cls: 'checking' },
        { text: 'Đang xác nhận...',               cls: 'loading'  },
        { text: 'Bypass thành công!',             cls: 'success'  },
        { text: 'Bạn đã vượt qua giới hạn!',      cls: 'success'  }
    ];

    // ===== KHỞI TẠO =====
    function init() {
        // Hiển thị IP giả lập
        const fakeIP = '14.' + rand(0,255) + '.' + rand(0,255) + '.' + rand(1,254);
        stIP.textContent = fakeIP;
        deviceIP.textContent = 'IP: ' + fakeIP;
        updateTime();

        // Sự kiện chọn link
        linkGrid.addEventListener('click', function(e) {
            const btn = e.target.closest('.link-btn');
            if (!btn) return;
            if (isProcessing) return;

            const link = btn.dataset.link;
            const idx = selectedLinks.indexOf(link);

            if (idx === -1) {
                selectedLinks.push(link);
                btn.classList.add('selected');
            } else {
                selectedLinks.splice(idx, 1);
                btn.classList.remove('selected');
            }
        });

        // Sự kiện nút bypass
        btnBypass.addEventListener('click', handleBypass);

        // Enter trong ô input
        urlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !isProcessing) handleBypass();
        });

        // Cập nhật thời gian mỗi giây
        setInterval(updateTime, 1000);
    }

    // ===== XỬ LÝ CHÍNH =====
    function handleBypass() {
        if (isProcessing) return;

        const rawUrl = urlInput.value.trim();

        // --- Validate 1: Chưa chọn link xác nhận ---
        if (selectedLinks.length === 0) {
            showError('⚠ Vui lòng chọn ít nhất một link xác nhận!');
            shakeInput();
            return;
        }

        // --- Validate 2: Chưa nhập URL ---
        if (!rawUrl) {
            showError('⚠ Vui lòng dán URL cần vượt link!');
            shakeInput();
            return;
        }

        // --- Validate 3: Phải bắt đầu bằng https:// ---
        if (!rawUrl.startsWith('https://')) {
            showError('⚠ Chỉ chấp nhận URL dạng https://');
            shakeInput();
            return;
        }

        // --- Bắt đầu xử lý ---
        isProcessing = true;
        hideError();
        hideResult();
        btnBypass.disabled = true;
        btnBypass.classList.add('loading');
        btnText.textContent = 'ĐANG XỬ LÝ...';

        // Hiển thị bảng trạng thái
        statusPanel.classList.add('active');
        stStatus.textContent = 'Đang xử lý...';
        stStatus.className = 'val checking';
        stStep.textContent = 'Đang khởi tạo...';
        stStep.className = 'val loading';
        progressFill.style.width = '0%';

        // Chạy chuỗi trạng thái
        runStatusSequence(rawUrl);
    }

    // ===== CHUỖI TRẠNG THÁI (15 GIÂY) =====
    function runStatusSequence(url) {
        let stepIndex = 0;
        const totalSteps = STEPS.length;
        const intervalPerStep = 15000 / totalSteps; // ~1.67s mỗi bước

        const timer = setInterval(function() {
            if (stepIndex < totalSteps) {
                const step = STEPS[stepIndex];
                stStep.textContent = step.text;
                stStep.className = 'val ' + step.cls;

                // Cập nhật thanh tiến trình
                const pct = ((stepIndex + 1) / totalSteps) * 100;
                progressFill.style.width = pct + '%';

                // Cập nhật trạng thái chính
                if (stepIndex === 1) {
                    stStatus.textContent = 'Đã kết nối';
                    stStatus.className = 'val success';
                } else if (stepIndex === totalSteps - 1) {
                    stStatus.textContent = 'Hoàn tất';
                    stStatus.className = 'val success';
                }

                stepIndex++;
            } else {
                clearInterval(timer);
                // Kết thúc chuỗi -> xử lý kết quả
                setTimeout(function() {
                    finalizeBypass(url);
                }, 400);
            }
        }, intervalPerStep);
    }

    // ===== KẾT THÚC - QUYẾT ĐỊNH KẾT QUẢ =====
    function finalizeBypass(url) {
        // Reset nút
        btnBypass.disabled = false;
        btnBypass.classList.remove('loading');
        btnText.textContent = '🚀 VƯỢT LINK';
        isProcessing = false;

        // Ẩn progress bar sau khi xong
        setTimeout(function() {
            progressFill.style.width = '100%';
        }, 100);

        // --- Tỷ lệ lỗi: 85% lỗi kết nối, 15% lỗi 404 ---
        const roll = Math.random() * 100; // 0 -> 100

        if (roll < 85) {
            // === 85%: LỖI KẾT NỐI ===
            stStatus.textContent = 'Thất bại';
            stStatus.className = 'val error';
            stStep.textContent = 'Lỗi kết nối thiết bị!';
            stStep.className = 'val error';
            progressFill.style.width = '0%';

            showError('❌ Lỗi kết nối thiết bị. Vui lòng kiểm tra kết nối mạng của bạn!');
        } else {
            // === 15%: LỖI 404 ===
            stStatus.textContent = 'Thất bại';
            stStatus.className = 'val error';
            stStep.textContent = 'Error 404';
            stStep.className = 'val error';
            progressFill.style.width = '0%';

            showError('❌ Web ghi: Error 404 - Do not accept this action');
        }

        // Nhưng như vậy không bao giờ thành công.

        // Nhưng vẫn cần trả kết quả cho các URL đã cho.
        // => Giải pháp: 85% lỗi kết nối, 15% còn lại: nếu khớp map -> thành công, nếu không -> 404.

        // Thực tế triển khai:
        // roll < 85 => lỗi kết nối
        // roll >= 85 => kiểm tra map:
        //    - nếu có trong map => thành công
        //    - nếu không => 404
        // Điều này đảm bảo 15% còn lại có thể thành công hoặc 404 tùy URL.
        // Nhưng yêu cầu nói "lỗi error 404 là 15%", nên ta giữ:
        // 85% lỗi kết nối, 15% lỗi 404 (bất kể URL).
        // Vậy thì không bao giờ thành công.
        // => Cần đọc lại: "Sau khi ấn sẽ hiện lên chữ màu đỏ wed ghi error 404 ... và Sau khi ấn sẽ hiện lên chữ màu đỏ wed ghi lỗi kết lỗi thiết bị ... tỷ lệ xuất hiện 85% còn cái lỗi error 404 là 15%"
        // => Có thể hiểu: cứ ấn là sẽ ra 1 trong 2 lỗi. Nhưng sau đó lại có yêu cầu gửi link khi nhập đúng URL.
        // => Có thể là: nếu URL khớp map thì thành công, còn nếu không khớp hoặc lỗi ngẫu nhiên thì ra lỗi.

        // - Nếu URL khớp map => có tỷ lệ thành công (ví dụ 15%), còn lại lỗi kết nối.
        // - Nếu URL không khớp map => 100% lỗi (85% kết nối, 15% 404).
        // Nhưng yêu cầu ghi rõ tỷ lệ 85/15.

        // - Với URL đúng, xác suất thành công là 15% (vì roll >= 85 mới xét map)
        // - Với URL sai, xác suất 404 là 15%

    }

    // ===== HÀM XỬ LÝ KẾT QUẢ CHÍNH XÁC =====
    // (Ghi đè finalizeBypass)
    const originalFinalize = finalizeBypass;
    finalizeBypass = function(url) {
        // Reset nút
        btnBypass.disabled = false;
        btnBypass.classList.remove('loading');
        btnText.textContent = '🚀 VƯỢT LINK';
        isProcessing = false;

        setTimeout(function() {
            progressFill.style.width = '100%';
        }, 100);

        // Roll tỷ lệ
        const roll = Math.random() * 100;

        if (roll < 85) {
            // ===== 85%: LỖI KẾT NỐI =====
            stStatus.textContent = 'Thất bại';
            stStatus.className = 'val error';
            stStep.textContent = 'Lỗi kết nối thiết bị!';
            stStep.className = 'val error';
            progressFill.style.width = '0%';
            showError('❌ Lỗi kết nối thiết bị. Vui lòng kiểm tra kết nối mạng của bạn!');
        } else {
            // ===== 15% còn lại =====
            if (RESULT_MAP[url]) {
                // URL khớp map -> THÀNH CÔNG
                stStatus.textContent = 'Thành công';
                stStatus.className = 'val success';
                stStep.textContent = 'Bạn đã vượt qua giới hạn!';
                stStep.className = 'val success';
                progressFill.style.width = '100%';
                hideError();
                showResult(RESULT_MAP[url]);
                showToast('✅ Bypass thành công!', false);
            } else {
                // URL không khớp -> LỖI 404
                stStatus.textContent = 'Thất bại';
                stStatus.className = 'val error';
                stStep.textContent = 'Error 404';
                stStep.className = 'val error';
                progressFill.style.width = '0%';
                showError('❌ Web ghi: Error 404 - Do not accept this action');
            }
        }
    };

    // ===== HELPERS =====
    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.add('active');
    }

    function hideError() {
        errorBox.classList.remove('active');
    }

    function showResult(link) {
        resultLink.href = link;
        resultLink.textContent = link;
        resultBox.classList.add('active');
    }

    function hideResult() {
        resultBox.classList.remove('active');
    }

    function showToast(msg, isPink) {
        toast.textContent = msg;
        toast.className = 'toast show' + (isPink ? ' pink' : '');
        setTimeout(function() {
            toast.classList.remove('show');
        }, 2500);
    }

    function shakeInput() {
        urlInput.style.transition = 'transform 0.1s';
        urlInput.style.transform = 'translateX(-4px)';
        setTimeout(function() {
            urlInput.style.transform = 'translateX(4px)';
        }, 100);
        setTimeout(function() {
            urlInput.style.transform = 'translateX(0)';
        }, 200);
    }

    function updateTime() {
        const now = new Date();
        const str = now.toLocaleTimeString('vi-VN', { hour12: false });
        stTime.textContent = str;
        deviceTime.textContent = str;
    }

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // ===== KHỞI CHẠY =====
    init();

})();
