<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bypass Tool — Gtraffic • Link4m • Layma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#00d9ff;
  --blue-d:#0090ff;
  --pink:#ff2d88;
  --pink-l:#ff7ac0;
  --bg:#04060e;
  --panel:#0a0f1e;
  --txt:#e6f1ff;
  --muted:#8fa7c4;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:26px 14px 70px;
  overflow-x:hidden;
  position:relative;
}
/* nền động */
body::before{
  content:'';
  position:fixed;inset:-25%;
  background:
    radial-gradient(circle at 12% 8%, rgba(0,217,255,.20), transparent 42%),
    radial-gradient(circle at 88% 88%, rgba(255,45,136,.20), transparent 42%),
    radial-gradient(circle at 60% 40%, rgba(0,144,255,.08), transparent 55%);
  animation:floatBg 14s ease-in-out infinite alternate;
  pointer-events:none;z-index:0;
}
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,217,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,45,136,.045) 1px, transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(circle at 50% 30%, #000 10%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 10%, transparent 78%);
  pointer-events:none;z-index:0;
}
@keyframes floatBg{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(0,-34px,0) scale(1.06)}
}

.wrap{width:100%;max-width:780px;position:relative;z-index:2}

/* ---------- CARD ---------- */
.card{
  position:relative;
  background:linear-gradient(160deg,rgba(9,15,32,.94),rgba(4,6,14,.97));
  border:1px solid rgba(0,217,255,.22);
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 0 34px rgba(0,217,255,.07), 0 0 60px rgba(255,45,136,.05), inset 0 1px 0 rgba(255,255,255,.04);
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--blue),var(--pink),transparent);
  opacity:.85;
}

/* ---------- HEADER ---------- */
.head{text-align:center;padding:26px 22px}
.title{
  font-size:clamp(24px,5vw,34px);
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(100deg,#00d9ff 0%,#7fe6ff 30%,#ff2d88 68%,#ff9ad2 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 18px rgba(0,217,255,.35));
  animation:hueShift 6s linear infinite;
}
@keyframes hueShift{
  0%,100%{filter:drop-shadow(0 0 18px rgba(0,217,255,.35))}
  50%{filter:drop-shadow(0 0 22px rgba(255,45,136,.42))}
}
.sub{
  margin-top:8px;font-size:13px;color:var(--muted);
  letter-spacing:1.6px;text-transform:uppercase;
}

/* ---------- SECTION TITLE ---------- */
.sec-title{
  display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:#bfe6ff;margin-bottom:14px;
}
.sec-title::before{
  content:'';width:5px;height:18px;border-radius:3px;
  background:linear-gradient(180deg,var(--blue),var(--pink));
  box-shadow:0 0 12px rgba(0,217,255,.7);
}

/* ---------- SITE GRID ---------- */
.site-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
}
.site{
  position:relative;
  font-family:inherit;font-size:14px;font-weight:600;
  color:#bfe0ff;
  padding:13px 12px;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(150deg,rgba(0,217,255,.06),rgba(255,45,136,.04));
  border:1px solid rgba(0,217,255,.25);
  transition:.22s ease;
  overflow:hidden;
  letter-spacing:.3px;
}
.site::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.16),transparent 70%);
  transform:translateX(-120%);
  transition:.5s;
}
.site:hover{
  border-color:rgba(255,45,136,.6);
  color:#fff;
  box-shadow:0 0 20px rgba(255,45,136,.25), 0 0 20px rgba(0,217,255,.12) inset;
  transform:translateY(-2px);
}
.site:hover::after{transform:translateX(120%)}
.site.active{
  background:linear-gradient(120deg,var(--blue-d),var(--blue) 35%,var(--pink) 100%);
  color:#04060e;font-weight:800;
  border-color:transparent;
  box-shadow:0 0 26px rgba(0,217,255,.45), 0 0 30px rgba(255,45,136,.35);
}
.site.active::before{
  content:'✓';
  position:absolute;top:5px;right:9px;
  font-size:12px;font-weight:900;color:#04060e;opacity:.85;
}

.sel-line{
  margin-top:14px;font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.sel-line b{
  color:var(--pink-l);
  text-shadow:0 0 12px rgba(255,45,136,.6);
}
.dot-live{
  width:8px;height:8px;border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 10px var(--blue);
  animation:pulse 1.4s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* ---------- INPUT ---------- */
.field-label{
  display:block;font-size:13px;color:#a9c6e6;
  margin-bottom:9px;letter-spacing:.4px;
}
.input-wrap{position:relative}
.input-wrap::before{
  content:'🔗';
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  font-size:15px;opacity:.65;pointer-events:none;
}
#urlInput{
  width:100%;
  font-family:inherit;font-size:15px;
  color:#eaf6ff;
  padding:15px 15px 15px 44px;
  border-radius:13px;
  background:rgba(2,6,16,.85);
  border:1px solid rgba(0,217,255,.3);
  outline:none;
  transition:.25s;
}
#urlInput::placeholder{color:#4d6787}
#urlInput:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,217,255,.12), 0 0 24px rgba(0,217,255,.22);
  background:rgba(2,8,20,.95);
}
#urlInput:disabled{opacity:.55;cursor:not-allowed}

.url-err{
  margin-top:10px;font-size:13.5px;font-weight:700;
  color:#ff3b5c;
  text-shadow:0 0 12px rgba(255,59,92,.55);
  display:none;
  animation:shake .45s;
}
.url-err.show{display:block}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}

/* ---------- BUTTON ---------- */
.btn{
  position:relative;
  width:100%;
  margin-top:16px;
  padding:17px;
  font-family:inherit;
  font-size:16px;
  font-weight:900;
  letter-spacing:2.4px;
  color:#04060e;
  border:none;border-radius:14px;
  cursor:pointer;
  background:linear-gradient(100deg,var(--blue-d),var(--blue) 30%,var(--pink) 78%,#ff5ba6);
  background-size:200% 100%;
  box-shadow:0 8px 30px rgba(0,217,255,.28), 0 0 34px rgba(255,45,136,.22);
  transition:.28s ease;
  overflow:hidden;
  text-transform:uppercase;
}
.btn:hover:not(:disabled){
  background-position:100% 0;
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(255,45,136,.4), 0 0 40px rgba(0,217,255,.35);
}
.btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.btn:disabled{
  cursor:not-allowed;
  filter:grayscale(.35) brightness(.75);
  box-shadow:none;
}
.btn .spin{
  display:none;
  width:15px;height:15px;margin-right:9px;
  border:2.5px solid rgba(4,6,14,.35);
  border-top-color:#04060e;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:-2px;
}
.btn.loading .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- PANEL ---------- */
.panel{display:none}
.panel.show{display:block;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;
  font-size:13.5px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:#bfe6ff;margin-bottom:16px;
}
.panel-head span.tag{
  font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:20px;
  color:var(--blue);
  border:1px solid rgba(0,217,255,.4);
  background:rgba(0,217,255,.08);
  animation:pulse 1.6s infinite;
}

/* progress */
.bar{
  height:5px;border-radius:6px;
  background:rgba(255,255,255,.06);
  overflow:hidden;margin-bottom:16px;
}
.bar i{
  display:block;height:100%;width:0%;
  border-radius:6px;
  background:linear-gradient(90deg,var(--blue),var(--pink));
  box-shadow:0 0 14px rgba(0,217,255,.7);
  transition:width .25s linear;
}

/* info grid */
.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:18px;
}
.info{
  padding:12px 14px;border-radius:12px;
  background:linear-gradient(150deg,rgba(0,217,255,.06),rgba(255,45,136,.04));
  border:1px solid rgba(0,217,255,.18);
}
.info span{
  display:block;font-size:10.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:#7b96b5;margin-bottom:5px;
}
.info b{
  font-size:13.5px;color:#dff2ff;font-weight:700;
  word-break:break-word;
}
.info b.ip{color:var(--blue);text-shadow:0 0 12px rgba(0,217,255,.55)}

/* steps */
.steps{list-style:none;display:flex;flex-direction:column;gap:7px}
.step{
  display:flex;align-items:center;gap:11px;
  padding:10px 13px;border-radius:11px;
  font-size:14px;color:#a8c2dd;
  background:rgba(0,217,255,.035);
  border-left:3px solid rgba(0,217,255,.35);
  opacity:0;
  animation:stepIn .35s ease forwards;
}
@keyframes stepIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.step i{
  width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--blue);
  box-shadow:0 0 10px var(--blue);
  animation:pulse 1.1s infinite;
}
.step.ok{
  color:#7dffc4;
  border-left-color:#1ee88a;
  background:rgba(30,232,138,.07);
}
.step.ok i{background:#1ee88a;box-shadow:0 0 12px #1ee88a;animation:none}
.step.bad{
  color:#ff5f7a;
  border-left-color:#ff2d55;
  background:rgba(255,45,85,.08);
}
.step.bad i{background:#ff2d55;box-shadow:0 0 12px #ff2d55;animation:none}

/* result */
.result{margin-top:16px}
.err-box{
  padding:18px 16px;border-radius:14px;text-align:center;
  font-size:15px;font-weight:900;letter-spacing:1px;
  color:#ff3b5c;
  background:rgba(255,0,60,.08);
  border:1px solid rgba(255,45,90,.55);
  text-shadow:0 0 16px rgba(255,59,92,.75);
  box-shadow:0 0 30px rgba(255,0,60,.18), inset 0 0 30px rgba(255,0,60,.06);
  animation:shake .5s, glowRed 2s infinite alternate;
}
.err-box small{
  display:block;margin-top:9px;font-size:11.5px;
  font-weight:500;letter-spacing:.4px;color:#c46b7e;text-shadow:none;
}
@keyframes glowRed{
  from{box-shadow:0 0 24px rgba(255,0,60,.15), inset 0 0 24px rgba(255,0,60,.05)}
  to{box-shadow:0 0 40px rgba(255,0,60,.35), inset 0 0 34px rgba(255,0,60,.10)}
}

.ok-box{
  padding:20px 16px;border-radius:14px;text-align:center;
  background:linear-gradient(150deg,rgba(0,217,255,.10),rgba(255,45,136,.10));
  border:1px solid rgba(0,217,255,.45);
  box-shadow:0 0 34px rgba(0,217,255,.18);
  animation:fadeUp .5s ease;
}
.ok-box h4{
  font-size:17px;letter-spacing:1.6px;margin-bottom:6px;
  background:linear-gradient(90deg,#00d9ff,#ff2d88);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ok-box p{font-size:13px;color:#a9c6e6;margin-bottom:16px}
.ok-box .filename {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 12px;
  word-break: break-all;
  text-shadow: 0 0 10px rgba(0,217,255,.5);
}
.dl{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  max-width:100%;
  padding:14px 20px;border-radius:12px;
  font-size:14px;font-weight:800;letter-spacing:.5px;
  color:#04060e;text-decoration:none;
  background:linear-gradient(100deg,var(--blue),var(--pink));
  box-shadow:0 8px 28px rgba(0,217,255,.28);
  transition:.25s;word-break:break-all;text-align:center;
}
.dl:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(255,45,136,.42)}
.copy{
  display:block;width:100%;margin-top:10px;
  padding:11px;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:1.2px;
  color:#9fd8ff;background:transparent;
  border:1px solid rgba(0,217,255,.32);
  transition:.22s;text-transform:uppercase;
}
.copy:hover{background:rgba(0,217,255,.1);color:#fff;border-color:var(--blue)}

/* footer */
.foot{
  text-align:center;font-size:11.5px;color:#42586f;
  letter-spacing:1.1px;margin-top:6px;
}
</style>
</head>

<script>
/* =========================================================
   CẤU HÌNH

const STEPS = [

  'Đang kiểm tra kết nối...',

/* Cơ sở dữ liệu link đã xác nhận */
const DATABASE = [
  {

    name: 'AimLock Bro.zip',
    link: 'https://www.mediafire.com/file/msusgfxw3xosdpl/AimLock+Bro.zip/file'
  },
  {

    link: 'https://www.mediafire.com/file/yqefvmq4mefu7h5/Minecraft_PE_26.30_BANDISHARE.apk/file'
  },
  {
    re: /^https:\/\/bbmkts\.com\/go\/Hfz47hy5\/?$/i,
    name: 'hackff menuFFM.zip',
    link: 'https://www.mediafire.com/file/i5eioodkjudzmty/hackff+menuFFM.zip/file'
  },
  {
    re: /^https:\/\/gtraffic\.io\/Yv2QaKD\/?$/i,
    name: 'Module gtraffic.io',
    link: 'https://pastefy.app/bbSrxKOk/raw'
  }
];

/* =========================================================
   DOM
   ========================================================= */
const $ = id => document.getElementById(id);
const input    = $('urlInput');
const btn      = $('btnBypass');
const btnText  = $('btnText');
const urlErr   = $('urlErr');
const panel    = $('panel');
const stepsUl  = $('steps');
const resultEl = $('result');
const barFill  = $('barFill');
const infoGrid = $('infoGrid');
const panelTag = $('panelTag');
const selName  = $('selName');

let running = false;

/* =========================================================
   CHỌN SITE
   ========================================================= */
document.querySelectorAll('.site').forEach(b => {
  b.addEventListener('click', () => {
    if (running) return;
    document.querySelectorAll('.site').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    selName.textContent = b.dataset.site;
  });
});

/* Tự chọn site theo domain khi nhập */
input.addEventListener('input', () => {
  urlErr.classList.remove('show');
  const v = input.value.trim().toLowerCase();
  const map = {
    'gtraffic.io': 'Gtraffic.io',
    'link4m.net': 'Link4m',
    'link4m.com': 'Link4m',
    'layma.net': 'Layma.net',
    'traffic4k.com': 'Traffic4k.com',
    'site2s.com': 'Site2s.com',
    'bbmkts.com': 'Bbmkt.com',
    'bbmkt.com': 'Bbmkt.com',
    'ontop.link': 'Ontop.link'
  };
  for (const key in map) {
    if (v.includes(key)) {
      document.querySelectorAll('.site').forEach(x => {
        x.classList.toggle('active', x.dataset.site === map[key]);
      });
      selName.textContent = map[key];
      return;
    }
  }
});

/* =========================================================
   TIỆN ÍCH
   ========================================================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand  = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

function fakeIP() {
  const pre = ['14.161', '113.22', '27.72', '42.113', '203.113', '171.244'];
  return pre[rand(0, pre.length - 1)] + '.' + rand(1, 254) + '.' + rand(2, 254);
}

function getDevice() {
  const ua = navigator.userAgent;
  let os = 'Unknown';
  if (/Windows/i.test(ua)) os = 'Windows';
  else if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
  else if (/Mac OS X/i.test(ua)) os = 'macOS';
  else if (/Linux/i.test(ua)) os = 'Linux';

  let br = 'Khác';
  if (/Edg\//i.test(ua)) br = 'Edge';
  else if (/OPR\//i.test(ua)) br = 'Opera';
  else if (/Chrome\//i.test(ua)) br = 'Chrome';
  else if (/Firefox\//i.test(ua)) br = 'Firefox';
  else if (/Safari\//i.test(ua)) br = 'Safari';

  return os + ' • ' + br;
}

function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function addStep(text, type) {
  const li = document.createElement('li');
  li.className = 'step' + (type ? ' ' + type : '');
  li.innerHTML = '<i></i><span>' + text + '</span>';
  stepsUl.appendChild(li);
  li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function showUrlError(msg) {
  urlErr.textContent = '⚠ ' + msg;
  urlErr.classList.remove('show');
  void urlErr.offsetWidth; // reset animation
  urlErr.classList.add('show');
}

function resetPanel() {
  stepsUl.innerHTML = '';
  resultEl.innerHTML = '';
  barFill.style.width = '0%';
  panelTag.textContent = 'ĐANG XỬ LÝ';
  panelTag.style.color = '';
  panelTag.style.borderColor = '';
  infoGrid.style.display = '';
}

/* =========================================================
   XỬ LÝ CHÍNH
   ========================================================= */
btn.addEventListener('click', startBypass);

async function startBypass() {
  if (running) return;

  const url = input.value.trim();

  /* --- Kiểm tra dạng https:// --- */
  if (!url) {
    showUrlError('Vui lòng dán URL của web cần vượt link!');
    return;
  }
  if (!/^https:\/\//i.test(url)) {
    showUrlError('Chỉ chấp nhận URL dạng https:// — vui lòng nhập lại!');
    return;
  }
  if (!/^https:\/\/[^\s]+\.[^\s]+/i.test(url)) {
    showUrlError('URL không hợp lệ. Vui lòng kiểm tra lại!');
    return;
  }

  urlErr.classList.remove('show');

  /* --- Bắt đầu --- */
  running = true;
  btn.disabled = true;
  btn.classList.add('loading');
  input.disabled = true;
  btnText.textContent = 'ĐANG XỬ LÝ...';

  resetPanel();
  panel.classList.add('show');

  // Thông tin thiết bị
  $('iTime').textContent = nowStr();
  $('iIp').textContent   = fakeIP();
  $('iDev').textContent  = getDevice();

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  /* --- Chạy 8 bước trong 12s --- */
  const stepDelay = 1500;
  for (let i = 0; i < STEPS.length; i++) {
    addStep(STEPS[i], i === 2 || i === 4 ? 'ok' : '');
    barFill.style.width = ((i + 1) / (STEPS.length + 2) * 100) + '%';
    await sleep(stepDelay);
  }

  /* --- Chờ cho đủ 15 giây --- */
  const remain = TOTAL_TIME - (STEPS.length * stepDelay);
  await sleep(remain);
  barFill.style.width = '100%';

  /* --- Xác định kết quả --- */
  const found = DATABASE.find(item => item.re.test(url));

  if (found) {
    /* ===== THÀNH CÔNG ===== */
    addStep(FINAL_OK, 'ok');
    panelTag.textContent = 'HOÀN TẤT';
    panelTag.style.color = '#7dffc4';
    panelTag.style.borderColor = 'rgba(30,232,138,.5)';
    panelTag.style.animation = 'none';

    resultEl.innerHTML = `
      <div class="ok-box">
        <h4>🎉 BYPASS THÀNH CÔNG</h4>
        <p>Bạn đã vượt qua giới hạn! Link đã được lấy về máy chủ.</p>
        <div class="filename">📄 ${found.name}</div>
        <a class="dl" href="${found.link}" target="_blank" rel="noopener">
          📦 TẢI XUỐNG NGAY
        </a>
        <button class="copy" id="copyBtn">📋 COPY LINK TẢI XUỐNG</button>
      </div>
    `;
    const copyBtn = $('copyBtn');
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(found.link).then(() => {
        copyBtn.textContent = '✅ ĐÃ COPY LINK';
        setTimeout(() => copyBtn.textContent = '📋 COPY LINK TẢI XUỐNG', 1800);
      }).catch(() => {
        copyBtn.textContent = '❌ KHÔNG COPY ĐƯỢC';
        setTimeout(() => copyBtn.textContent = '📋 COPY LINK TẢI XUỐNG', 1800);
      });
    });

  } else {
    /* ===== LỖI ===== */
    // Ẩn toàn bộ thông tin thiết bị khi có lỗi
    infoGrid.style.display = 'none';

    // Tỷ lệ: 85% lỗi kết nối — 15% lỗi 404
    const is404 = Math.random() < 0.15;

    panelTag.textContent = 'THẤT BẠI';
    panelTag.style.color = '#ff5f7a';
    panelTag.style.borderColor = 'rgba(255,45,85,.5)';
    panelTag.style.animation = 'none';

    if (is404) {
      addStep('Xác thực thất bại — mã không hợp lệ!', 'bad');
      resultEl.innerHTML = `
        <div class="err-box">
          ERROR 404 — DO NOT ACCEPT THIS ACTION
          <small>Mã bypass không tồn tại hoặc đã hết hạn.</small>
        </div>`;
    } else {
      addStep('Mất kết nối tới máy chủ!', 'bad');
      resultEl.innerHTML = `
        <div class="err-box">
          LỖI KẾT NỐI — THIẾT BỊ VUI LÒNG KIỂM TRA KẾT NỐI MẠNG CỦA BẠN
          <small>Vui lòng kiểm tra mạng và thử lại sau.</small>
        </div>`;
    }
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* --- Mở khoá --- */
  running = false;
  btn.disabled = false;
  btn.classList.remove('loading');
  input.disabled = false;
  btnText.textContent = 'VƯỢT LINK LẦN NỮA';
}

/* Nhấn Enter để chạy */
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') startBypass();
});
</script>
</body>
</html>
